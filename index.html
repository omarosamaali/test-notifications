<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبّت التطبيق - خرائف</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #e8cb9a;
      --navy: #060f22;
      --card: rgba(6, 20, 45, 0.88);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'El Messiri', sans-serif;
      background: var(--navy);
      min-height: 100vh;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(0, 80, 120, .45) 0%, transparent 60%);
    }

    .page {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    .logo-wrap img {
      width: 88px;
      filter: drop-shadow(0 0 20px rgba(232, 203, 154, .4));
    }

    .app-name {
      font-size: 2.2rem;
      color: var(--gold);
      margin-top: 10px;
    }

    .install-card {
      background: var(--card);
      border: 1px solid rgba(232, 203, 154, .2);
      border-radius: 24px;
      padding: 30px;
      margin-top: 30px;
    }

    .btn-install {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #c0873a, #e8cb9a);
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .success-box {
      display: none;
      color: #4ade80;
      margin-top: 20px;
    }

    .success-box.show {
      display: block;
    }
  </style>
</head>

<body>
  <div class="stars"></div>
  <div class="page">
    <div class="logo-wrap">
      <img src="images/animated-logo-ii.gif" alt="خرائف">
      <div class="app-name">خرائف</div>
    </div>

    <div class="install-card">
      <h2 style="color:var(--gold)">تثبيت التطبيق</h2>
      <p style="margin: 15px 0 25px; opacity: 0.7;">استمتع بتجربة أسرع من شاشتك الرئيسية</p>
      <button class="btn-install" id="installBtn">📲 تثبيت الآن</button>
      <div class="success-box" id="successInstall">
        <h3>✅ تم التثبيت بنجاح</h3>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBQCPTwnybdtLNUwNCzDDA23TLt3pD5zP4",
      authDomain: "omdachina25.firebaseapp.com",
      projectId: "omdachina25",
      storageBucket: "omdachina25.firebasestorage.app",
      messagingSenderId: "1031143486488",
      appId: "1:1031143486488:web:0a662055d970826268bf6d"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    async function subscribeUser() {
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          console.log('🚫 رفض المستخدم الإذن');
          return;
        }

        const vKey = "BB168ueRnlIhDY0r5lrLD7pvQydPk467794F97CWizmwnvzxAWtlx3fuZ9NQtxc0QeokXdnBjiYoiINBIRvCQiY";
        const token = await getToken(messaging, { vapidKey: vKey });

        if (!token) {
          console.warn('⚠️ مفيش توكن');
          return;
        }

        // لو اشترك قبل كده متبعتش تاني
        if (localStorage.getItem('notif_token') === token) {
          console.log('✅ مشترك بالفعل');
          return;
        }

        // ابعت الـ token للـ server عشان يشترك في topic 'all'
        const serverUrl = window.location.port === '3000'
          ? '/subscribe'
          : 'http://localhost:3000/subscribe';
        const res = await fetch(serverUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        if (res.ok) {
          localStorage.setItem('notif_token', token);
          console.log('✅ تم الاشتراك في الإشعارات');
        } else {
          console.warn('⚠️ فشل الاشتراك، هيحاول مرة تانية بكره');
        }
      } catch (err) {
        console.error('💥 خطأ في الاشتراك:', err);
      }
    }

    subscribeUser();
  </script>
</body>

</html>
